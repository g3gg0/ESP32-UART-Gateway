name: Build firmware and publish web tools

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C3 firmware and package HTML
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32c3
          path: .
          command: |
            set -e
            idf.py build
            python package_web.py
            python prepare_pages.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check packaged tools and embedded firmware
        run: node --test --test-isolation=none tests/web-package.test.cjs tests/cc3200-package.test.cjs tests/flasher-package.test.cjs
      - name: Upload generated HTML
        uses: actions/upload-artifact@v4
        with:
          name: web-tools
          path: _site/
          if-no-files-found: error
      - name: Upload Pages site
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
