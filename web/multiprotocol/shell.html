<!DOCTYPE html>
<!-- Generated by package_web.py. Edit web/multiprotocol sources. -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Protocol Debug Console</title>


    {{styles}}
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Multi-Protocol Debug Console</h1>
            <div class="connection-controls">
                <div class="connection-status" id="statusIndicator" data-state="disconnected" role="status" aria-live="polite">
                    <span class="status-led" aria-hidden="true"></span>
                    <span id="connectionStatusText">Disconnected</span>
                </div>
                <button class="btn-primary connection-toggle" id="connectBtn" onclick="toggleConnection()">Connect</button>
            </div>
        </div>

        <div class="main-content">
            <div class="protocol-tabs" id="protocolTabs">
                <button class="protocol-tab active" id="protoTabSwd" onclick="setActiveProtocolTab('swd')">SWD</button>
                <button class="protocol-tab" id="protoTabCan" onclick="setActiveProtocolTab('can')"
                    disabled>CAN</button>
                <button class="protocol-tab" id="protoTabUart" onclick="setActiveProtocolTab('uart')"
                    disabled>UART</button>
                <button class="protocol-tab" id="protoTabCanonEf" onclick="setActiveProtocolTab('canonef')"
                    disabled>Canon EF</button>
            </div>

            {{view:swd}}

            {{view:can}}

            {{view:uart}}

            {{view:ef}}

            <details class="collapsible-group" id="consoleDetails">
                <summary>Console <span id="consoleCount">0 messages</span></summary>
                <div class="collapsible-body">
                <div class="swd-toolbar" style="margin-bottom: 8px;">
                    <label>Level <select id="consoleLevel" onchange="renderConsole()">
                        <option value="all">All</option>
                        <option value="error">Errors</option>
                        <option value="log">Device logs</option>
                        <option value="info">Info</option>
                    </select></label>
                    <label>Filter <input id="consoleFilter" type="search" oninput="renderConsole()"></label>
                    <button class="btn-secondary" onclick="clearConsole()">Clear console</button>
                </div>
                <div class="console-display" id="consoleDisplay"></div>
                </div>
            </details>
        </div>

        <div class="footer">
            Multi-protocol utility - SWD, CAN, UART and Canon EF on one connection
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    {{scripts}}
</body>

</html>
