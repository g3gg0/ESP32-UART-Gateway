<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESP32C3 Gateway Config</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'JetBrains Mono','Cascadia Code','Consolas','Courier New',monospace;
      background:#0c1118;
      min-height:100vh;
      padding:24px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      color:#d1d5db
    }
    .container{
      max-width:1000px;
      width:100%;
      background:#121923;
      border-radius:10px;
      border:1px solid #263241;
      box-shadow:0 12px 36px rgba(0,0,0,.38);
      overflow:hidden
    }
    .header{background:#111923;padding:20px;border-bottom:1px solid #2c3a4b}
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    h2{font-size:20px;color:#e5e7eb}
    .content{padding:20px}
    .btn{
      display:inline-block;
      text-decoration:none;
      padding:10px 20px;
      border:1px solid #334155;
      border-radius:6px;
      font-size:13px;
      font-weight:600;
      background:#1f2a38;
      color:#dbe4ef
    }
    .btn:hover{background:#2a384b}
    fieldset{margin-bottom:14px;border:1px solid #2a3646;border-radius:6px;background:#101720;padding:10px 12px}
    legend{padding:0 6px;color:#d4deea;font-size:12px;font-weight:700;letter-spacing:.04em}
    label{display:block;margin-top:8px;margin-bottom:4px;font-size:12px;color:#9aa8b7;font-weight:700}
    input{
      width:100%;
      padding:8px;
      border:1px solid #38485c;
      border-radius:6px;
      background:#0f1620;
      color:#e5e7eb;
      font-family:inherit;
      font-size:13px
    }
    input:focus{outline:none;border-color:#5f7896;box-shadow:0 0 8px rgba(95,120,150,.3)}
    button{
      margin-top:14px;
      padding:10px 20px;
      border:1px solid #334155;
      border-radius:6px;
      font-size:13px;
      font-weight:700;
      background:#1f2a38;
      color:#dbe4ef;
      font-family:inherit;
      cursor:pointer
    }
    button:hover{background:#2a384b}
    .footer{padding:10px 20px;border-top:1px solid #2a3646;font-size:12px;color:#9aa8b7;text-align:center;background:#101720}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="top">
        <h2>ESP32C3 Gateway Configuration</h2>
        {{FILES_LINK}}
      </div>
    </div>
    <div class="content">
      <form method="POST" action="/save">
        {{FORM_FIELDS}}
        <button type="submit">Save and Reboot</button>
      </form>
    </div>
    <div class="footer">Gateway configuration interface</div>
  </div>
</body>
</html>
